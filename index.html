<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Goal Tracker</title>
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Goal Tracker" />
    <meta name="theme-color" content="#0b0f19" />
    <link rel="apple-touch-icon" sizes="180x180" href="/goal-tracker/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/goal-tracker/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/goal-tracker/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/goal-tracker/favicon.svg" />
    
    <style>
      /* iOS safe area inset padding helper and smooth scrolling */
      :root {
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
        --sar: env(safe-area-inset-right);
      }
      body {
        background-color: #0b0f19;
        color: #f8fafc;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none;
      }
    </style>
  </head>
  <body class="bg-brand-dark text-slate-100 min-h-screen antialiased selection:bg-tennis-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
